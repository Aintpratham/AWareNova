<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Nova Phase5">
  <!-- AWareNova logo mark.
       Original artwork: a script capital N drawn as a single
       monoline stroke inside a soft squircle badge.

       This standalone file is the STATIC version, used for the
       favicon and apple-touch-icon (which cannot read CSS custom
       properties). The badge fill here is the cobalt fallback and
       matches the --accent fallback in css/global.css.

       The header uses the same geometry inline (see .nav-badge in
       css/global.css) so its badge follows the dynamic accent.
       If the path below is ever redrawn, update the inline copy
       in the <nav> of all 10 public pages to match. -->
  <rect width="48" height="48" rx="14" fill="#1F3FD1"/>
  <path d="M 10.4 32.2 C 11.4 35.4 13.4 35.8 13.8 33.2 C 14.6 28 15.2 21.2 15.8 16.6 C 16.2 13 18.8 12.6 19.9 15.8 C 21.8 21.6 24.2 28.4 26.6 33.8 C 27.6 35.9 29.4 35.5 29.8 33 C 30.7 27.2 31.7 20.6 32.7 16 C 33.4 12.8 36 12.8 36.8 15.6"
        fill="none" stroke="#FFFFFF" stroke-width="3.3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
